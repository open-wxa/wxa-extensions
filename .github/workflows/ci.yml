name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 发布前由 release.yml 调用
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # vp check：格式、lint、类型检查
      - run: pnpm check
      - run: pnpm test

  e2e:
    # 用 npm 上的 wxa-runner（开发依赖 @open-wxa/wxa-runner-core）。Linux 上没有微信开发者工具：
    # 编译器和基础库用 wxa-runner 安装时带的 Linux 版和内置版，与用户在 Linux 上安装时相同
    runs-on: ubuntu-latest
    env:
      # runner 镜像自带 Google Chrome
      WXA_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 找不到编译器或 Chrome 时先在这里报出来，原因比 E2E 里的报错直接
      - name: Check compiler and Chrome
        run: |
          node -e "const r = require('module').createRequire(require.resolve('@open-wxa/wxa-runner-core')); console.log(r('@open-wxa/wxa-runner-compiler').findCompilerBinaries())"
          test -x "$WXA_CHROME"

      # CI 上 E2E 的条件不满足时直接失败，不会跳过（见 tests/e2e/inspector.test.ts）
      - run: pnpm test:e2e
